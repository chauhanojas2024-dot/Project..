<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Bulb Remote — Full App</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2563eb",
            accent: "#7c3aed",
            warm: "#ffb347",
            onGreen: "#10B981",
            offGray: "#E5E7EB",
          },
          fontFamily: { sans: ["Inter", "sans-serif"] },
        },
      },
    };
  </script>

  <style>
    body { background: linear-gradient(180deg,#05060a 0%, #0b0b10 100%); }

    /* Bulb SVG styles */
    .bulb-color { transition: all 0.35s ease; }
    .bulb-on { filter: drop-shadow(0 0 18px rgba(255,230,120,0.9)); opacity:1; }
    .bulb-off { opacity:0.28; filter:none; }

    /* breathing animation uses CSS variable for intensity */
    @keyframes breathing {
      0% { transform: scale(1); filter: drop-shadow(0 0 calc(var(--breathe) * 6px) rgba(255,230,120,0.85)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 calc(var(--breathe) * 18px) rgba(255,230,120,0.95)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 calc(var(--breathe) * 6px) rgba(255,230,120,0.85)); }
    }
    .breathing { animation: breathing 3s ease-in-out infinite; }

    /* disabled overlay for lock/child-safety */
    .locked-overlay { background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); }

    /* tiny helper */
    .glass { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); }

    /* responsive small changes for mobile thumb */
    @media (max-width:420px) {
      .big-btn { padding-left:1.1rem; padding-right:1.1rem; }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans text-gray-200">
  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- LEFT: Controls / Rooms -->
    <div class="md:col-span-1 glass rounded-2xl p-6 border border-white/6 shadow-[0_8px_32px_#00000060]">
      <h2 class="text-2xl font-extrabold text-white mb-2">Smart Home — Lighting</h2>
      <p class="text-sm text-gray-400 mb-4">Remote app style (Philips Hue-ish). Manage rooms & bulbs.</p>

      <!-- Rooms selector / Multi-bulb list -->
      <label class="text-xs font-semibold text-gray-300">Rooms</label>
      <select id="roomSelect" class="w-full mt-2 mb-4 p-2 rounded bg-gray-900 text-white">
      </select>

      <div id="bulbList" class="space-y-2 mb-4 max-h-40 overflow-y-auto"></div>

      <div class="flex items-center justify-between gap-2">
        <button id="addRoomBtn" class="flex-1 py-2 rounded bg-primary hover:bg-blue-600 font-semibold">+ Add Room</button>
        <button id="renameRoomBtn" class="py-2 px-3 rounded bg-gray-800 hover:bg-gray-700">Rename</button>
      </div>

      <hr class="my-4 border-white/6" />

      <div class="text-xs text-gray-400">
        Tip: Save presets per bulb. Disco mode will animate selected bulb(s).
      </div>
    </div>

    <!-- CENTER: Bulb preview + main actions -->
    <div class="md:col-span-1 glass rounded-2xl p-6 border border-white/6 shadow-[0_8px_32px_#00000060] flex flex-col items-center">

      <!-- Bulb preview SVG -->
      <div class="flex flex-col items-center mb-4 w-full">
        <div class="w-full flex items-center justify-between mb-2">
          <div>
            <div id="bulbName" class="text-lg font-bold">Living Room — Main</div>
            <div id="bulbSub" class="text-xs text-gray-400">Status: <span id="statusText">OFF</span></div>
          </div>

          <div class="text-right text-xs">
            <div>Power / Watts</div>
            <div id="powerUsage" class="text-sm font-semibold">0 W</div>
          </div>
        </div>

        <svg id="mainBulb" width="160" height="210" viewBox="0 0 80 120" class="bulb-color bulb-off transition-all duration-300">
          <ellipse id="bOuter" cx="40" cy="42" rx="28" ry="36" fill="#fff9c4"></ellipse>
          <ellipse id="bInner" cx="40" cy="46" rx="22" ry="30" fill="#ffd95b"></ellipse>
          <ellipse cx="32" cy="34" rx="7" ry="12" fill="#fff" opacity="0.5"/>
          <rect x="28" y="75" width="24" height="20" rx="6" fill="#d1d5db"></rect>
          <rect x="32" y="95" width="16" height="14" rx="5" fill="#9ca3af"></rect>
          <rect x="35" y="109" width="10" height="8" rx="4" fill="#6b7280"></rect>
        </svg>

        <div id="previewBadge" class="mt-3 text-sm text-gray-300">Brightness: <span id="previewBrightness">0%</span></div>
      </div>

      <!-- Big action button -->
      <div class="w-full flex flex-col items-center gap-3">
        <button id="powerBtn" class="big-btn px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-500">TURN ON</button>

        <div class="w-full flex gap-2">
          <button id="nightBtn" class="flex-1 py-2 rounded bg-warm/40 hover:bg-warm/30">Night Mode</button>
          <button id="lockBtn" class="py-2 px-3 rounded bg-gray-800 hover:bg-gray-700">Lock</button>
        </div>

        <div class="w-full flex gap-2">
          <button id="discoBtn" class="flex-1 py-2 rounded bg-accent hover:bg-purple-600">Disco Mode</button>
          <button id="breatheBtn" class="py-2 px-3 rounded bg-gray-800 hover:bg-gray-700">Breathing</button>
        </div>
      </div>

    </div>

    <!-- RIGHT: Advanced controls, color, timer, presets, log -->
    <div class="md:col-span-1 glass rounded-2xl p-6 border border-white/6 shadow-[0_8px_32px_#00000060]">

      <h3 class="text-lg font-bold mb-3">Controls</h3>

      <label class="text-xs font-semibold text-gray-300">Brightness</label>
      <input id="brightness" type="range" min="0" max="100" value="0" class="w-full mt-2 mb-3" />

      <label class="text-xs font-semibold text-gray-300">Color (RGB)</label>
      <div class="flex gap-2 items-center mb-3">
        <input id="colorPicker" type="color" class="w-12 h-12 p-0 rounded" />
        <input id="rInput" type="number" min="0" max="255" class="w-16 p-2 rounded bg-gray-800 text-sm" />
        <input id="gInput" type="number" min="0" max="255" class="w-16 p-2 rounded bg-gray-800 text-sm" />
        <input id="bInput" type="number" min="0" max="255" class="w-16 p-2 rounded bg-gray-800 text-sm" />
      </div>

      <div class="flex gap-2 mb-3">
        <button id="savePresetBtn" class="flex-1 py-2 rounded bg-primary hover:bg-blue-600">Save Preset</button>
        <button id="applyPresetBtn" class="py-2 px-3 rounded bg-gray-800">Apply</button>
      </div>

      <label class="text-xs font-semibold text-gray-300">Auto Timer</label>
      <div class="flex gap-2 mb-3">
        <input id="timerSeconds" type="number" placeholder="seconds" class="flex-1 p-2 bg-gray-800 rounded" />
        <button id="timerOnBtn" class="py-2 px-3 rounded bg-green-600">ON</button>
        <button id="timerOffBtn" class="py-2 px-3 rounded bg-red-600">OFF</button>
      </div>

      <label class="text-xs font-semibold text-gray-300">Schedule Alarm</label>
      <div class="flex flex-col gap-2 mb-3">
        <input id="schOn" type="time" class="p-2 bg-gray-800 rounded" />
        <input id="schOff" type="time" class="p-2 bg-gray-800 rounded" />
        <div class="flex gap-2 mt-2">
          <button id="setScheduleBtn" class="flex-1 py-2 rounded bg-primary">Set</button>
          <button id="clearScheduleBtn" class="py-2 px-3 rounded bg-gray-800">Clear</button>
        </div>
      </div>

      <label class="text-xs font-semibold text-gray-300">Saved Presets</label>
      <div id="presets" class="max-h-24 overflow-y-auto space-y-2 p-2 bg-gray-900 rounded mb-3"></div>

      <hr class="my-3 border-white/6" />

      <div class="flex items-center justify-between text-xs text-gray-400">
        <div>Lock / Child-safety</div>
        <div id="lockIndicator" class="font-bold">Unlocked</div>
      </div>

      <div id="log" class="mt-4 p-3 h-28 overflow-y-auto text-xs bg-black/30 rounded text-gray-300">
        <div>System initialized...</div>
      </div>

    </div>

  </div>

  <!-- audio feedback -->
  <audio id="sOn" src="https://assets.mixkit.co/sfx/preview/mixkit-switch-on-2831.mp3"></audio>
  <audio id="sOff" src="https://assets.mixkit.co/sfx/preview/mixkit-switch-off-2830.mp3"></audio>

<script>
  /* -------------------- Data Model -------------------- */
  const DEFAULT_WATTAGE = 10; // wattage at 100% brightness per bulb

  let data = {
    rooms: [
      { id: 'room-1', name: 'Living Room', bulbs: [
        { id: 'bulb-1', name: 'Ceiling', on: false, color: '#fff06a', brightness: 80, watt: DEFAULT_WATTAGE, breathing: false, disco: false }
      ]},
      { id: 'room-2', name: 'Bedroom', bulbs: [
        { id: 'bulb-2', name: 'Bed Lamp', on: false, color: '#ffd95b', brightness: 30, watt: DEFAULT_WATTAGE, breathing:false, disco:false }
      ]}
    ],
    selectedRoomIndex: 0,
    selectedBulbId: null,
    locked: false,
    presets: [],
    schedule: null, // {on: 'HH:MM', off: 'HH:MM'}
  };

  /* -------------------- Helpers -------------------- */
  const $ = id => document.getElementById(id);
  const log = (m) => { const l = $('log'); const p = document.createElement('div'); p.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; l.prepend(p); };

  function saveState() { localStorage.setItem('smartlight_state_v1', JSON.stringify(data)); }
  function loadState() { const s = localStorage.getItem('smartlight_state_v1'); if (s) { try{ data = JSON.parse(s); }catch(e){} } }

  /* -------------------- Init -------------------- */
  loadState();

  // UI elements
  const roomSelect = $('roomSelect');
  const bulbList = $('bulbList');
  const bulbName = $('bulbName');
  const bulbSub = $('bulbSub');
  const mainBulb = $('mainBulb');
  const bOuter = $('bOuter');
  const bInner = $('bInner');
  const statusText = $('statusText');
  const powerUsage = $('powerUsage');
  const previewBrightness = $('previewBrightness');

  const brightness = $('brightness');
  const colorPicker = $('colorPicker');
  const rInput = $('rInput');
  const gInput = $('gInput');
  const bInput = $('bInput');

  const powerBtn = $('powerBtn');
  const nightBtn = $('nightBtn');
  const lockBtn = $('lockBtn');
  const discoBtn = $('discoBtn');
  const breatheBtn = $('breatheBtn');

  const savePresetBtn = $('savePresetBtn');
  const presetsDiv = $('presets');

  const timerSeconds = $('timerSeconds');
  const timerOnBtn = $('timerOnBtn');
  const timerOffBtn = $('timerOffBtn');

  const schOn = $('schOn');
  const schOff = $('schOff');
  const setScheduleBtn = $('setScheduleBtn');
  const clearScheduleBtn = $('clearScheduleBtn');

  const sOn = $('sOn');
  const sOff = $('sOff');

  /* -------------------- Room & Bulb Management -------------------- */
  function renderRooms() {
    roomSelect.innerHTML = '';
    data.rooms.forEach((r, idx) => {
      const opt = document.createElement('option'); opt.value = idx; opt.textContent = r.name; roomSelect.appendChild(opt);
    });
    roomSelect.value = data.selectedRoomIndex;
    renderBulbList();
  }

  function renderBulbList(){
    bulbList.innerHTML = '';
    const room = data.rooms[data.selectedRoomIndex];
    room.bulbs.forEach(b => {
      const div = document.createElement('div'); div.className = 'flex items-center justify-between p-2 rounded bg-gray-800/50';
      div.innerHTML = `
        <div>
          <div class='font-semibold'>${b.name}</div>
          <div class='text-xs text-gray-400'>${b.on? 'ON' : 'OFF'} • ${b.brightness}%</div>
        </div>
        <div class='flex items-center gap-2'>
          <button data-id='${b.id}' class='selectBulbBtn px-2 py-1 rounded bg-gray-700 text-xs'>Select</button>
          <button data-id='${b.id}' class='toggleBulbBtn px-2 py-1 rounded bg-gray-700 text-xs'>Toggle</button>
        </div>
      `;
      bulbList.appendChild(div);
    });

    // attach handlers
    document.querySelectorAll('.selectBulbBtn').forEach(el => el.onclick = () => { selectBulb(el.dataset.id); });
    document.querySelectorAll('.toggleBulbBtn').forEach(el => el.onclick = () => { toggleBulbById(el.dataset.id); });

    // ensure selected exists
    if (!data.selectedBulbId && data.rooms[data.selectedRoomIndex].bulbs.length) {
      data.selectedBulbId = data.rooms[data.selectedRoomIndex].bulbs[0].id;
    }
    renderSelectedBulb();
    saveState();
  }

  roomSelect.addEventListener('change', (e)=>{ data.selectedRoomIndex = parseInt(e.target.value); renderBulbList(); });

  function getSelectedBulb(){
    const room = data.rooms[data.selectedRoomIndex];
    return room.bulbs.find(b=>b.id===data.selectedBulbId) || room.bulbs[0];
  }

  function selectBulb(id){ data.selectedBulbId = id; renderSelectedBulb(); }

  function toggleBulbById(id){
    for(const r of data.rooms){ const b = r.bulbs.find(x=>x.id===id); if(b){ b.on = !b.on; log(`<b>${b.name}</b> toggled ${b.on? 'ON':'OFF'}`); saveState(); renderBulbList(); return; } }
  }

  /* -------------------- Render selected bulb -------------------- */
  function renderSelectedBulb(){
    const b = getSelectedBulb();
    if(!b) return;
    bulbName.textContent = `${data.rooms[data.selectedRoomIndex].name} — ${b.name}`;
    statusText.textContent = b.on ? 'ON' : 'OFF';
    brightness.value = b.brightness;
    previewBrightness.textContent = b.brightness + '%';
    colorPicker.value = b.color;
    const rgb = hexToRgb(b.color);
    rInput.value = rgb.r; gInput.value = rgb.g; bInput.value = rgb.b;

    updateBulbVisual(b);
    renderPresets();
  }

  function updateBulbVisual(b){
    if(b.on){
      mainBulb.classList.add('bulb-on'); mainBulb.classList.remove('bulb-off');
    } else { mainBulb.classList.remove('bulb-on'); mainBulb.classList.add('bulb-off'); }

    bOuter.setAttribute('fill', shadeColor(b.color, 0.14));
    bInner.setAttribute('fill', b.color);

    // breathing visual
    if(b.breathing) mainBulb.classList.add('breathing'); else mainBulb.classList.remove('breathing');

    // breathing intensity variable -> map brightness
    mainBulb.style.setProperty('--breathe', (b.brightness/100).toString());

    // compute and show wattage
    const watt = Math.round((b.watt * (b.brightness/100)) * 10) / 10;
    powerUsage.textContent = `${watt} W`;

    // if disco active, we'll handle separately
  }

  /* -------------------- Color helpers -------------------- */
  function hexToRgb(hex) { const h = hex.replace('#',''); return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) }; }
  function rgbToHex(r,g,b){ return '#'+[r,g,b].map(x=>{ const s = Number(x).toString(16); return s.length===1? '0'+s : s; }).join(''); }
  function shadeColor(hex, percent){ const {r,g,b} = hexToRgb(hex); const nr=Math.min(255, Math.round(r*(1-percent)+255*percent)); const ng=Math.min(255, Math.round(g*(1-percent)+255*percent)); const nb=Math.min(255, Math.round(b*(1-percent)+255*percent)); return rgbToHex(nr,ng,nb); }

  /* -------------------- UI interactions -------------------- */
  powerBtn.onclick = () => {
    if (data.locked) return alert('Controls are locked');
    const b = getSelectedBulb(); if(!b) return;
    b.on = !b.on; sOn.currentTime = 0; sOff.currentTime = 0; (b.on? sOn.play() : sOff.play()); log(`${b.name} turned ${b.on? 'ON' : 'OFF'}`); renderSelectedBulb(); renderBulbList(); saveState();
  };

  brightness.addEventListener('input', (e)=>{
    if (data.locked) return; const b = getSelectedBulb(); if(!b) return; b.brightness = parseInt(e.target.value); previewBrightness.textContent = b.brightness + '%'; updateBulbVisual(b); renderBulbList(); saveState();
  });

  colorPicker.addEventListener('input', (e)=>{ if (data.locked) return; const b = getSelectedBulb(); if(!b) return; b.color = e.target.value; const rgb = hexToRgb(b.color); rInput.value = rgb.r; gInput.value = rgb.g; bInput.value = rgb.b; updateBulbVisual(b); saveState(); });

  [rInput,gInput,bInput].forEach(inp => inp.addEventListener('change', ()=>{ if (data.locked) return; let r = Math.min(255,Math.max(0,parseInt(rInput.value||0))); let g = Math.min(255,Math.max(0,parseInt(gInput.value||0))); let b = Math.min(255,Math.max(0,parseInt(bInput.value||0))); const hex = rgbToHex(r,g,b); const bulb = getSelectedBulb(); bulb.color = hex; colorPicker.value = hex; updateBulbVisual(bulb); saveState(); }));

  nightBtn.onclick = ()=>{ if (data.locked) return; const b = getSelectedBulb(); b.color = '#ffb47b'; b.brightness = 20; b.on = true; log(`Night Mode applied to ${b.name}`); renderSelectedBulb(); renderBulbList(); saveState(); };

  lockBtn.onclick = ()=>{ data.locked = !data.locked; $('lockIndicator').textContent = data.locked? 'Locked' : 'Unlocked'; lockBtn.textContent = data.locked? 'Unlock' : 'Lock'; log(`${data.locked? 'Locked' : 'Unlocked'} controls`); saveState(); };

  /* -------------------- Disco (Party) Mode -------------------- */
  let discoInterval = null;
  discoBtn.onclick = ()=>{
    if (data.locked) return; const b = getSelectedBulb(); b.disco = !b.disco; if(b.disco) startDisco(b); else stopDisco(b); saveState(); };

  function startDisco(b){
    let idx = 0;
    const palette = ['#ff4d4d','#ffd24d','#7bff7b','#7bd3ff','#d77bff','#ff7bb3'];
    b.disco = true; log(`Disco started on ${b.name}`);
    discoInterval = setInterval(()=>{
      const color = palette[idx % palette.length]; idx++; b.color = color; b.on = true; updateBulbVisual(b); renderBulbList(); saveState(); }, 700);
  }
  function stopDisco(b){ clearInterval(discoInterval); discoInterval = null; b.disco = false; log(`Disco stopped on ${b.name}`); saveState(); }

  /* -------------------- Breathing -------------------- */
  breatheBtn.onclick = ()=>{ if (data.locked) return; const b = getSelectedBulb(); b.breathing = !b.breathing; log(`${b.breathing? 'Breathing ON' : 'Breathing OFF'} on ${b.name}`); updateBulbVisual(b); saveState(); };

  /* -------------------- Presets -------------------- */
  function renderPresets(){ presetsDiv.innerHTML = ''; data.presets.forEach((p,idx)=>{
    const el = document.createElement('div'); el.className = 'flex items-center justify-between p-2 rounded bg-gray-800/40';
    el.innerHTML = `<div class='text-sm'>${p.name}</div><div class='flex gap-2'><button data-i='${idx}' class='applyPreset px-2 py-1 rounded bg-primary text-xs'>Apply</button><button data-i='${idx}' class='delPreset px-2 py-1 rounded bg-gray-700 text-xs'>Del</button></div>`;
    presetsDiv.appendChild(el);
  });
  document.querySelectorAll('.applyPreset').forEach(el=>el.onclick = ()=>{ applyPreset(parseInt(el.dataset.i)); });
  document.querySelectorAll('.delPreset').forEach(el=>el.onclick = ()=>{ data.presets.splice(parseInt(el.dataset.i),1); renderPresets(); saveState(); }); }

  savePresetBtn.onclick = ()=>{
    if (data.locked) return; const b = getSelectedBulb(); const name = prompt('Preset name (e.g., Reading, Cozy)'); if(!name) return; data.presets.push({ name, color: b.color, brightness: b.brightness }); renderPresets(); saveState(); log(`Preset "${name}" saved`);
  };
  function applyPreset(i){ const p = data.presets[i]; const b = getSelectedBulb(); b.color = p.color; b.brightness = p.brightness; b.on = true; renderSelectedBulb(); renderBulbList(); saveState(); log(`Preset "${p.name}" applied to ${b.name}`); }

  applyPresetBtn.onclick = ()=>{ if (data.presets.length===0) return alert('No presets saved'); applyPreset(0); };

  /* -------------------- Timer / Alarm -------------------- */
  timerOnBtn.onclick = ()=>{ if (data.locked) return; const s = parseInt(timerSeconds.value); if(!s || s<=0) return alert('Enter seconds'); log(`Timer: will turn ON in ${s}s`); setTimeout(()=>{ const b = getSelectedBulb(); b.on = true; renderSelectedBulb(); renderBulbList(); log('Timer completed: turned ON'); saveState(); }, s*1000); };
  timerOffBtn.onclick = ()=>{ if (data.locked) return; const s = parseInt(timerSeconds.value); if(!s || s<=0) return alert('Enter seconds'); log(`Timer: will turn OFF in ${s}s`); setTimeout(()=>{ const b = getSelectedBulb(); b.on = false; renderSelectedBulb(); renderBulbList(); log('Timer completed: turned OFF'); saveState(); }, s*1000); };

  setScheduleBtn.onclick = ()=>{ if (data.locked) return; const onT = schOn.value; const offT = schOff.value; if(!onT || !offT) return alert('Set both times'); data.schedule = { on:onT, off:offT, room: data.selectedRoomIndex, bulb: data.selectedBulbId }; log(`Schedule set ON:${onT} OFF:${offT}`); saveState(); };
  clearScheduleBtn.onclick = ()=>{ data.schedule = null; log('Schedule cleared'); saveState(); };

  // periodic check for schedule
  setInterval(()=>{
    if(!data.schedule) return;
    const now = new Date(); const hhmm = now.toTimeString().slice(0,5);
    if(hhmm === data.schedule.on){ // find that bulb and turn on
      const room = data.rooms[data.schedule.room]; if(room){ const b = room.bulbs.find(x=>x.id===data.schedule.bulb); if(b && !b.on){ b.on = true; log(`Scheduled ON: ${b.name}`); saveState(); renderBulbList(); if(getSelectedBulb().id===b.id) renderSelectedBulb(); } }
    }
    if(hhmm === data.schedule.off){ const room = data.rooms[data.schedule.room]; if(room){ const b = room.bulbs.find(x=>x.id===data.schedule.bulb); if(b && b.on){ b.on = false; log(`Scheduled OFF: ${b.name}`); saveState(); renderBulbList(); if(getSelectedBulb().id===b.id) renderSelectedBulb(); } } }
  }, 1000);

  /* -------------------- Power usage indicator (total for room) -------------------- */
  function computeRoomPower(){ const room = data.rooms[data.selectedRoomIndex]; let total=0; room.bulbs.forEach(b=>{ total += (b.on? b.watt*(b.brightness/100) : 0); }); return Math.round(total*10)/10; }

  // periodically update power readout for preview and show total in room select label
  setInterval(()=>{ const roomPower = computeRoomPower(); // update UI
    // update a small badge on room select (not native - we set title)
    roomSelect.title = `Room power: ${roomPower} W`;
    // update main preview if selected
    const b = getSelectedBulb(); if(b) powerUsage.textContent = `${Math.round((b.watt*(b.brightness/100))*10)/10} W`;
  }, 800);

  /* -------------------- Utility: unique id gen & add room ---------- */
  function uid(prefix='id') { return prefix + '-' + Math.random().toString(36).slice(2,9); }
  $('addRoomBtn').onclick = ()=>{
    const name = prompt('Room name'); if(!name) return; const newRoom = { id: uid('room'), name, bulbs:[ { id: uid('bulb'), name: 'Main Lamp', on:false, color:'#fff06a', brightness:70, watt:DEFAULT_WATTAGE, breathing:false, disco:false } ] }; data.rooms.push(newRoom); data.selectedRoomIndex = data.rooms.length-1; renderRooms(); log(`Room "${name}" added`); saveState(); };
  $('renameRoomBtn').onclick = ()=>{ const name = prompt('New room name', data.rooms[data.selectedRoomIndex].name); if(!name) return; data.rooms[data.selectedRoomIndex].name = name; renderRooms(); saveState(); };

  /* -------------------- Initial render -------------------- */
  renderRooms();

  /* -------------------- Helpers continued: hex color display & initial sync */
  function syncAll(){ renderRooms(); renderSelectedBulb(); renderPresets(); }
  syncAll();

  // ensure preview updates if user directly edits numbers
  [rInput,gInput,bInput].forEach(i=> i.addEventListener('input', ()=>{ const hex = rgbToHex(parseInt(rInput.value||0), parseInt(gInput.value||0), parseInt(bInput.value||0)); colorPicker.value = hex; const b = getSelectedBulb(); b.color = hex; updateBulbVisual(b); saveState(); }));

  // on load, pick first bulb
  if(!data.selectedBulbId && data.rooms.length && data.rooms[0].bulbs.length) data.selectedBulbId = data.rooms[0].bulbs[0].id;
  renderSelectedBulb();

  // expose toggleBulbById for convenience
  window.toggleBulbById = toggleBulbById;

</script>
</body>
</html>
